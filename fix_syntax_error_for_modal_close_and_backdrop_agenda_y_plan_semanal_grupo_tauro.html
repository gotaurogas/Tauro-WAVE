                                <div>
                                    <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Fecha</label>
                                    <input type="date" id="m-date" required value="${state.modal.data.date}" class="w-full border dark:border-slate-600 rounded px-3 py-2 font-medium bg-white dark:bg-slate-900 text-slate-900 dark:text-white">
                                </div>
                                <div class="grid grid-cols-2 gap-1">
                                    <div>
                                        <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Inicio</label>
                                        <input type="time" id="m-start" required value="${state.modal.data.startTime || '09:00'}" class="w-full border dark:border-slate-600 rounded px-2 py-2 font-medium bg-white dark:bg-slate-900 text-slate-900 dark:text-white">
                                    </div>
                                    <div>
                                        <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Fin</label>
                                        <input type="time" id="m-end" required value="${state.modal.data.endTime || '10:00'}" class="w-full border dark:border-slate-600 rounded px-2 py-2 font-medium bg-white dark:bg-slate-900 text-slate-900 dark:text-white">
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Sala / Ubicación</label>
                                    <select id="m-loc" ${isZoom ? 'disabled' : ''} class="w-full border dark:border-slate-600 rounded px-2 py-2 font-medium bg-white dark:bg-slate-900 text-slate-900 dark:text-white ${isZoom ? 'opacity-50 cursor-not-allowed' : ''}">
                                        <option value="SALA DE JUNTAS TAPIAS" ${state.modal.data.location === 'SALA DE JUNTAS TAPIAS' ? 'selected' : ''}>SALA DE JUNTAS TAPIAS</option>
                                        <option value="SALA DE JUNTAS EDIFICIO C" ${state.modal.data.location === 'SALA DE JUNTAS EDIFICIO C' ? 'selected' : ''}>SALA DE JUNTAS EDIFICIO C</option>
                                        <option value="SALA DE JUNTAS VALLE" ${state.modal.data.location === 'SALA DE JUNTAS VALLE' ? 'selected' : ''}>SALA DE JUNTAS VALLE</option>
                                        <option value="SALA DE IDEAS" ${state.modal.data.location === 'SALA DE IDEAS' ? 'selected' : ''}>SALA DE IDEAS</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Modalidad</label>
                                    <select id="m-mod" onchange="toggleModalityFields(this.value)" class="w-full border dark:border-slate-600 rounded px-2 py-2 font-medium bg-white dark:bg-slate-900 text-slate-900 dark:text-white">
                                        <option value="Presencial" ${!isZoom ? 'selected' : ''}>Presencial</option>
                                        <option value="Zoom / Videoconferencia" ${isZoom ? 'selected' : ''}>Zoom / Videoconferencia</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Prioridad</label>
                                    <select id="m-color" class="w-full border dark:border-slate-600 rounded px-2 py-2 font-medium bg-white dark:bg-slate-900 text-slate-900 dark:text-white">
                                        <option value="red" ${state.modal.data.color === 'red' ? 'selected' : ''}>🔴 Alto</option>
                                        <option value="amber" ${state.modal.data.color === 'amber' ? 'selected' : ''}>🟠 Medio</option>
                                        <option value="emerald" ${state.modal.data.color === 'emerald' ? 'selected' : ''}>🟢 Bajo</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Recordatorio / Aviso</label>
                                    <select id="m-rem" class="w-full border dark:border-slate-600 rounded px-2 py-2 font-medium bg-white dark:bg-slate-900 text-slate-900 dark:text-white">
                                        <option value="15" ${state.modal.data.reminder === '15' ? 'selected' : ''}>15 mins antes</option>
                                        <option value="30" ${state.modal.data.reminder === '30' ? 'selected' : ''}>30 mins antes</option>
                                        <option value="60" ${state.modal.data.reminder === '60' ? 'selected' : ''}>1 hora antes</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Descripción / Minuta</label>
                                <textarea id="m-desc" rows="2" class="w-full border dark:border-slate-600 rounded p-2 font-medium bg-white dark:bg-slate-900 text-slate-900 dark:text-white">${state.modal.data.description || ''}</textarea>
                            </div>
                            <div class="flex justify-end gap-2 pt-2 border-t border-slate-200 dark:border-slate-700">
                                <button type="button" onclick="closeModal()" class="px-3 py-1.5 border border-slate-300 dark:border-slate-600 rounded text-slate-600 dark:text-slate-300">Cancelar</button>
                                <button type="submit" class="px-4 py-1.5 bg-[#0078d4] text-white rounded font-medium">Guardar Reunión</button>
                            </div>
                        </form>
                    </div>
                `;
            }
            const backdrop = document.getElementById('modal-backdrop');
            if (backdrop) backdrop.className = 'flex fixed inset-0 bg-black/40 backdrop-blur-xs z-50 items-center justify-center p-4';
            safeCreateIcons();
        }

        function toggleModalityFields(modality) {
            const locSelect = document.getElementById('m-loc');
            if (!locSelect) return;
            if (modality === 'Zoom / Videoconferencia') {
                locSelect.disabled = true;
                locSelect.value = 'Zoom / Videoconferencia';
                locSelect.className = 'w-full border dark:border-slate-600 rounded px-2 py-2 font-medium bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed opacity-50';
            } else {
                locSelect.disabled = false;
                locSelect.value = 'SALA DE JUNTAS TAPIAS';
                locSelect.className = 'w-full border dark:border-slate-600 rounded px-2 py-2 font-medium bg-white dark:bg-slate-900 text-slate-900 dark:text-white';
            }
        }

        function saveMeetingForm(e) {
            if (e) e.preventDefault();
            
            const idEl = document.getElementById('m-id');
            const titleEl = document.getElementById('m-title');
            const dateEl = document.getElementById('m-date');
            const startEl = document.getElementById('m-start');
            const endEl = document.getElementById('m-end');
            const modEl = document.getElementById('m-mod');
            const locEl = document.getElementById('m-loc');
            const colorEl = document.getElementById('m-color');
            const remEl = document.getElementById('m-rem');
            const descEl = document.getElementById('m-desc');

            if (!idEl || !titleEl || !dateEl || !startEl || !endEl) return;

            const id = idEl.value;
            const title = titleEl.value;
            const date = dateEl.value;
            const startTime = startEl.value;
            const endTime = endEl.value;
            const modality = modEl ? modEl.value : 'Presencial';
            const location = modality === 'Zoom / Videoconferencia' ? 'Zoom / Videoconferencia' : (locEl ? locEl.value : 'SALA DE JUNTAS TAPIAS');
            const color = colorEl ? colorEl.value : 'blue';
            const reminder = remEl ? remEl.value : '15';
            const description = descEl ? descEl.value : '';

            const index = state.meetings.findIndex(x => x.id === id);
            const obj = { id, department: state.currentUser.department, title, date, startTime, endTime, location, modality, color, reminder, description };

            if (index >= 0) {
                state.meetings[index] = obj;
            } else {
                state.meetings.push(obj);
            }

            saveState();
            closeModal();
            render();
            showToast("Reunión guardada exitosamente.");
        }

        function deleteMeeting(id) {
            state.meetings = state.meetings.filter(x => x.id !== id);
            saveState();
            render();
            showToast("Reunión eliminada.", "error");
        }

        function openActivityModal(activityId = null, presetDate = null) {
            const act = activityId ? state.activities.find(x => x.id === activityId) : null;
            const isEdit = !!act;
            
            const now = new Date();
            const yearNow = now.getFullYear();
            const monthNow = String(now.getMonth() + 1).padStart(2, '0');
            const dayNow = String(now.getDate()).padStart(2, '0');
            const defaultTodayStr = `${yearNow}-${monthNow}-${dayNow}`;

            const targetDate = isEdit && act.date ? act.date : (presetDate || defaultTodayStr);

            state.modal = {
                isOpen: true,
                type: 'activity',
                data: act || { id: 'a_' + Date.now(), department: state.currentUser.department, date: targetDate, day: 'Lunes', task: '', comments: '', status: 'PENDIENTE', priority: 'Media' }
            };

            const contentEl = document.getElementById('modal-content');
            if (contentEl) {
                const parts = targetDate.split('-');
                const initDate = parts.length === 3 ? new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2])) : new Date();
                const initDayIndex = initDate.getDay();
                const map = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                const initDayName = map[initDayIndex] || 'Lunes';

                contentEl.innerHTML = `
                    <div class="p-6 space-y-4 text-xs">
                        <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-3">
                            <h3 class="text-sm font-bold text-slate-900 dark:text-white">${isEdit ? 'Editar Actividad Semanal' : 'Nueva Actividad Semanal'}</h3>
                            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                        <form onsubmit="saveActivityForm(event)" class="space-y-3">
                            <input type="hidden" id="a-edit-id" value="${isEdit ? act.id : ''}">
                            
                            <div>
                                <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">FECHA (DÍA, MES, AÑO)</label>
                                <input type="date" id="a-date-input" required value="${targetDate}" onchange="onActivityDateChange(this.value)" class="w-full border dark:border-slate-600 rounded px-3 py-2 bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-medium">
                                <span id="a-assigned-day-label" class="text-blue-600 dark:text-blue-400 font-bold mt-1 block">Día asignado: ${initDayName}</span>
                            </div>

                            <div>
                                <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Prioridad / Criticidad</label>
                                <select id="a-prio" class="w-full border dark:border-slate-600 rounded px-3 py-2 bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-medium">
                                    <option value="Alta" ${isEdit && act.priority === 'Alta' ? 'selected' : ''}>Alta - Rojo</option>
                                    <option value="Media" ${isEdit && act.priority === 'Media' ? 'selected' : (!isEdit ? 'selected' : '')}>Media - Amarillo</option>
                                    <option value="Baja" ${isEdit && act.priority === 'Baja' ? 'selected' : ''}>Baja - Verde</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Tarea</label>
                                <textarea id="a-task" rows="2" required placeholder="Descripción de la actividad..." class="w-full border dark:border-slate-600 rounded p-2 bg-white dark:bg-slate-900 text-slate-900 dark:text-white">${isEdit ? act.task : ''}</textarea>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Comentarios / Detalles a considerar</label>
                                <textarea id="a-comments" rows="2" placeholder="Notas o detalles adicionales..." class="w-full border dark:border-slate-600 rounded p-2 bg-white dark:bg-slate-900 text-slate-900 dark:text-white">${isEdit && act.comments ? act.comments : ''}</textarea>
                            </div>
                            <div class="flex justify-end gap-2 pt-2 border-t border-slate-200 dark:border-slate-700">
                                <button type="button" onclick="closeModal()" class="px-3 py-1.5 border border-slate-300 dark:border-slate-600 rounded text-slate-600 dark:text-slate-300">Cancelar</button>
                                <button type="submit" class="px-4 py-1.5 bg-[#0078d4] text-white rounded font-medium">Guardar</button>
                            </div>
                        </form>
                    </div>
                `;
            }
            const backdrop = document.getElementById('modal-backdrop');
            if (backdrop) backdrop.className = 'flex fixed inset-0 bg-black/40 backdrop-blur-xs z-50 items-center justify-center p-4';
            safeCreateIcons();
        }

        function onActivityDateChange(dateValue) {
            const labelEl = document.getElementById('a-assigned-day-label');
            if (!labelEl || !dateValue) return;
            const parts = dateValue.split('-');
            if (parts.length === 3) {
                const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                const map = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                const dayName = map[d.getDay()] || 'Lunes';
                labelEl.textContent = `Día asignado: ${dayName}`;
            }
        }

        function saveActivityForm(e) {
            if (e) e.preventDefault();
            const editIdEl = document.getElementById('a-edit-id');
            const dateInputEl = document.getElementById('a-date-input');
            const prioEl = document.getElementById('a-prio');
            const taskEl = document.getElementById('a-task');
            const commentsEl = document.getElementById('a-comments');

            if (!dateInputEl || !prioEl || !taskEl) return;

            const editId = editIdEl ? editIdEl.value : '';
            const dateValue = dateInputEl.value; // YYYY-MM-DD
            const parts = dateValue.split('-');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]);
            const day = parseInt(parts[2]);

            const d = new Date(year, month - 1, day);
            const dayIndex = d.getDay();
            const map = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const calculatedDayName = map[dayIndex] || 'Lunes';

            // Automatically set week plan view to match the selected activity's week
            state.weekPlanDate = new Date(year, month - 1, day);

            if (editId) {
                const act = state.activities.find(x => x.id === editId);
                if (act) {
                    act.date = dateValue;
                    act.day = calculatedDayName;
                    act.task = taskEl.value;
                    act.comments = commentsEl ? commentsEl.value.trim() : '';
                    act.priority = prioEl.value;
                }
                showToast("Actividad actualizada exitosamente.");
            } else {
                state.activities.push({ 
                    id: 'a_' + Date.now(), 
                    department: state.currentUser.department, 
                    date: dateValue,
                    day: calculatedDayName, 
                    task: taskEl.value,
                    comments: commentsEl ? commentsEl.value.trim() : '',
                    priority: prioEl.value, 
                    status: 'PENDIENTE' 
                });
                showToast("Actividad añadida y visible en el panel semanal.");
            }

            saveState();
            closeModal();
            render();
        }

        function updateActivityStatus(id, val) {
            const a = state.activities.find(x => x.id === id);
            if (a) { a.status = val; saveState(); render(); showToast("Estatus actualizado."); }
        }

        function deleteActivity(id) {
            state.activities = state.activities.filter(x => x.id !== id);
            saveState();
            render();
            showToast("Actividad eliminada.", "error");
        }

        function closeModal() {
            state.modal.isOpen = false;
            const backdrop = document.getElementById('modal-backdrop');
            if (backdrop) backdrop.className = 'hidden fixed inset-0 bg-black/40 backdrop-blur-xs z-50 items-center justify-center p-4';
        }

        function toggleUserMenu() {
            const menu = document.getElementById('user-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        window.onload = function() {
            loadState();
            render();
        };
    </script>
</body>
</html>
