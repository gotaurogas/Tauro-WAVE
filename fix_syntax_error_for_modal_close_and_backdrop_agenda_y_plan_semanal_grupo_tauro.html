        const defaultMeetings = [

            },
            {

            },
            {

                calendarId: 'cal_planta',
                title: 'Auditoría de ciberseguridad industrial OT/IT',

        const defaultActivities = [
            { id: 'a1', department: 'sec_hig', day: 'Lunes', date: '2026-11-02', task: 'Auditoría matutina de permisos de trabajo', status: 'COMPLETADA', priority: 'Alta' },
            { id: 'a2', department: 'sec_hig', day: 'Miércoles', date: '2026-11-04', task: 'Capacitación manejo de residuos peligrosos', status: 'EN PROCESO', priority: 'Media' },
            { id: 'a3', department: 'mantenimiento', day: 'Lunes', date: '2026-11-02', task: 'Revisión de tableros eléctricos principales', status: 'COMPLETADA', priority: 'Alta' },
            { id: 'a4', department: 'logistica', day: 'Miércoles', date: '2026-11-04', task: 'Revisión documental de bitácoras de viaje', status: 'PENDIENTE', priority: 'Media' }
        ];

        let state = {
            isAuthenticated: false,
            currentUser: null,
            activeTab: 'lider_agenda',
            calendarViewMode: 'week', // 'week', 'day', 'month'
            selectedDepartment: 'sec_hig',
            meetings: defaultMeetings,
            activities: defaultActivities,
            calendars: defaultCalendars,
            gerenteCalendars: defaultGerenteCalendars,
            activeGerenteCal: 'cal_op', // 'cal_op' or 'cal_go'
            flashTasks: [
                {
                    id: 'tf_1',
                    folio: 'TF-MTTO-001',
                    department: 'mantenimiento',
                    station: 'TAPIAS',
                    task: 'Revisión fugas dispensario 3',
                    description: 'Atender reporte de fuga menor en pistola de despacho #3. Realizar cambio de empaques.',
                    impact: 'OPERACION',
                    criticality: 'Alto',
                    status: 'PENDIENTE',
                    dateCreated: '2026-11-02',
                    evidenceNote: '',
                    evidenceFile: null
                },
                {
                    id: 'tf_2',
                    folio: 'TF-SH-001',
                    department: 'sec_hig',
                    station: 'KORIAN',
                    task: 'Recarga de extintores isla 1',
                    description: 'Inspeccionar y reacondicionar extintores caducos en la estación Korian.',
                    impact: 'SEGURIDAD',
                    criticality: 'Medio',
                    status: 'EN PROCESO',
                    dateCreated: '2026-11-01',
                    evidenceNote: 'Enviado equipo a proveedor.',
                    evidenceFile: null
                }
            ],
            currentDate: new Date(2026, 10, 2), // Nov 2, 2026
            miniCalendarDate: new Date(2026, 10, 1), // Nov 2026
            weekPlanDate: new Date(2026, 10, 2), // Current week base date for Week Plan
            darkMode: false,
            modal: { isOpen: false, type: null, data: null },
            notificationsOpen: false,
            draggingMeetingId: null
        };

        function saveState() {
            try {
                localStorage.setItem('tauro_state', JSON.stringify({
                    meetings: state.meetings,
                    activities: state.activities,
                    calendars: state.calendars,
                    gerenteCalendars: state.gerenteCalendars,
                    flashTasks: state.flashTasks,
                    darkMode: state.darkMode,
                    isAuthenticated: state.isAuthenticated,
                    currentUser: state.currentUser
                }));
            } catch (e) {
                console.error("Error saving state", e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('tauro_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.meetings = parsed.meetings || defaultMeetings;
                    state.activities = parsed.activities || defaultActivities;
                    state.calendars = parsed.calendars || defaultCalendars;
                    state.gerenteCalendars = parsed.gerenteCalendars || defaultGerenteCalendars;
                    state.flashTasks = parsed.flashTasks || [];
                    state.darkMode = parsed.darkMode || false;
                    state.isAuthenticated = parsed.isAuthenticated || false;
                    state.currentUser = parsed.currentUser || null;
                    if (state.darkMode) {
                        document.documentElement.classList.add('dark');
                    }
                }
            } catch (e) {
                console.error("Error loading state", e);
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-2.5 rounded-lg text-xs font-semibold shadow-lg text-white pointer-events-auto transition-all transform translate-y-2 opacity-0 flex items-center gap-2 ${type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-4 h-4"></i> ${message}`;
            container.appendChild(toast);
            safeCreateIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function safeCreateIcons() {
            try {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            } catch (e) {
                console.error("Lucide icons error", e);
            }
        }

        // --- AUTHENTICATION & LOGIN ---
        function login(e) {
            if (e) e.preventDefault();
            const emailInput = document.getElementById('login-email');
            const passInput = document.getElementById('login-pass');
            if (!emailInput || !passInput) return;

            const email = emailInput.value.trim();
            const pass = passInput.value.trim();

            const foundUser = INITIAL_USERS.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === pass);
            if (foundUser) {
                state.isAuthenticated = true;
                state.currentUser = foundUser;
                state.activeTab = foundUser.role === 'Gerente' ? 'gerente_monitoreo' : 'lider_agenda';
                saveState();
                render();
                showToast(`Bienvenido, ${foundUser.name}`);
            } else {
                showToast("Correo o contraseña incorrectos.", "error");
            }
        }

        function logout() {
            state.isAuthenticated = false;
            state.currentUser = null;
            saveState();
            render();
            showToast("Sesión cerrada correctamente.");
        }

        // --- HELPER CALCULATIONS ---
        function getDepartmentSiglas(deptId) {
            const map = {
                'sec_hig': 'SH',
                'mantenimiento': 'MTTO',
                'logistica': 'LOG',
                'supervision': 'SUP',
                'atencion': 'ATC',
                'sistemas': 'TI',
                'volumetrico': 'CV',
                'calidad': 'CAL'
            };
            return map[deptId] || 'GEN';
        }

        function getPendingFlashTaskCountForLeader(deptId) {
            return state.flashTasks.filter(t => t.department === deptId && t.status !== 'VALIDADO').length;
        }

        function getPendingFlashReviewCountForGerente() {
            return state.flashTasks.filter(t => t.status === 'COMPLETADO').length;
        }

        function getCriticalityBadgeClass(crit) {
            if (crit === 'Alto') return 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 border-red-200 dark:border-red-900';
            if (crit === 'Medio') return 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border-amber-200 dark:border-amber-900';
            return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border-emerald-200 dark:border-emerald-900';
        }

        function getFlashStatusBadgeClass(status) {
            if (status === 'VALIDADO') return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border-emerald-300 dark:border-emerald-900';
            if (status === 'COMPLETADO') return 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300 border-blue-300 dark:border-blue-900';
            if (status === 'EN PROCESO') return 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border-amber-300 dark:border-amber-900';
            return 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 border-red-300 dark:border-red-900';
        }

        function calculateProgress(deptId) {
            const deptActs = state.activities.filter(a => a.department === deptId);
            if (deptActs.length === 0) return 0;
            const completed = deptActs.filter(a => a.status === 'COMPLETADA').length;
            const inProcess = deptActs.filter(a => a.status === 'EN PROCESO').length;
            const score = (completed * 100) + (inProcess * 50);
            return Math.round(score / deptActs.length);
        }

        function calculateGlobalProgress() {
            if (state.activities.length === 0) return 0;
            const completed = state.activities.filter(a => a.status === 'COMPLETADA').length;
            const inProcess = state.activities.filter(a => a.status === 'EN PROCESO').length;
            const score = (completed * 100) + (inProcess * 50);
            return Math.round(score / state.activities.length);
        }

        function getDepartmentName(deptId) {
            const d = INITIAL_DEPARTMENTS.find(x => x.id === deptId);
            return d ? d.name : 'Gerencia';
        }

        function getDepartmentIcon(deptId) {
            const d = INITIAL_DEPARTMENTS.find(x => x.id === deptId);
            return d ? d.icon : 'briefcase';
        }

        function getDeptCardTheme(deptId) {
            const themes = {
                'sec_hig': 'bg-blue-50/80 dark:bg-blue-950/30 text-blue-800 dark:text-blue-300 border-blue-200 dark:border-blue-900',
                'mantenimiento': 'bg-amber-50/80 dark:bg-amber-950/30 text-amber-800 dark:text-amber-300 border-amber-200 dark:border-amber-900',
                'logistica': 'bg-emerald-50/80 dark:bg-emerald-950/30 text-emerald-800 dark:text-emerald-300 border-emerald-200 dark:border-emerald-900',
                'supervision': 'bg-purple-50/80 dark:bg-purple-950/30 text-purple-800 dark:text-purple-300 border-purple-200 dark:border-purple-900',
                'atencion': 'bg-rose-50/80 dark:bg-rose-950/30 text-rose-800 dark:text-rose-300 border-rose-200 dark:border-rose-900',
                'sistemas': 'bg-indigo-50/80 dark:bg-indigo-950/30 text-indigo-800 dark:text-indigo-300 border-indigo-200 dark:border-indigo-900',
                'volumetrico': 'bg-cyan-50/80 dark:bg-cyan-950/30 text-cyan-800 dark:text-cyan-300 border-cyan-200 dark:border-cyan-900',
                'calidad': 'bg-teal-50/80 dark:bg-teal-950/30 text-teal-800 dark:text-teal-300 border-teal-200 dark:border-teal-900',
                'gerencia': 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border-slate-300 dark:border-slate-700'
            };
            return themes[deptId] || themes['gerencia'];
        }

        function getDeptMeetingCardStyle(deptId, defaultColor) {
            const styles = {
                'sec_hig': 'bg-blue-50 dark:bg-blue-950/60 text-blue-950 dark:text-blue-100 border-l-4 border-blue-600 shadow-2xs',
                'mantenimiento': 'bg-amber-50 dark:bg-amber-950/60 text-amber-950 dark:text-amber-100 border-l-4 border-amber-600 shadow-2xs',
                'logistica': 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-950 dark:text-emerald-100 border-l-4 border-emerald-600 shadow-2xs',
                'supervision': 'bg-purple-50 dark:bg-purple-950/60 text-purple-950 dark:text-purple-100 border-l-4 border-purple-600 shadow-2xs',
                'atencion': 'bg-rose-50 dark:bg-rose-950/60 text-rose-950 dark:text-rose-100 border-l-4 border-rose-600 shadow-2xs',
                'sistemas': 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-950 dark:text-indigo-100 border-l-4 border-indigo-600 shadow-2xs',
                'volumetrico': 'bg-cyan-50 dark:bg-cyan-950/60 text-cyan-950 dark:text-cyan-100 border-l-4 border-cyan-600 shadow-2xs',
                'calidad': 'bg-teal-50 dark:bg-teal-950/60 text-teal-950 dark:text-teal-100 border-l-4 border-teal-600 shadow-2xs',
                'gerencia': 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100 border-l-4 border-slate-600 shadow-2xs'
            };

            if (deptId && styles[deptId]) {
                return styles[deptId];
            }
            return getMeetingCardTheme(defaultColor);
        }

        function getMeetingCardTheme(color) {
            if (color === 'red') {
                return 'bg-red-50 dark:bg-red-950/40 text-red-900 dark:text-red-200 border-l-4 border-red-600';
            } else if (color === 'amber') {
                return 'bg-amber-50 dark:bg-amber-950/40 text-amber-900 dark:text-amber-200 border-l-4 border-amber-500';
            } else {
                return 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 border-l-4 border-emerald-600';
            }
        }

        function getPriorityBadgeClass(priority) {
            if (priority === 'Alta') return 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 border-red-200 dark:border-red-900';
            if (priority === 'Media') return 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border-amber-200 dark:border-amber-900';
            return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border-emerald-200 dark:border-emerald-900';
        }

        function getPriorityDotClass(colorOrPriority) {
            if (colorOrPriority === 'red' || colorOrPriority === 'Alta') {
                return '<span class="w-2 h-2 rounded-full bg-red-500 inline-block shrink-0 shadow-2xs" title="Prioridad Alta"></span>';
            }
            if (colorOrPriority === 'amber' || colorOrPriority === 'Media') {
                return '<span class="w-2 h-2 rounded-full bg-orange-500 inline-block shrink-0 shadow-2xs" title="Prioridad Media"></span>';
            }
            return '<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block shrink-0 shadow-2xs" title="Prioridad Baja"></span>';
        }

        function getStatusSelectClass(status) {
            if (status === 'COMPLETADA') return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border-emerald-300 dark:border-emerald-900';
            if (status === 'EN PROCESO') return 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border-amber-300 dark:border-amber-900';
            return 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 border-red-300 dark:border-red-900';
        }

        // --- RENDER SYSTEM ---
        function renderSubNav(isGerente) {
            let tabsHtml = '';
            if (isGerente) {
                const reviewCount = getPendingFlashReviewCountForGerente();
                const gerenteBadgeHtml = reviewCount > 0 
                    ? '<span class="ml-1 px-1.5 py-0.5 text-[10px] font-extrabold bg-red-600 text-white rounded-full shadow-xs animate-pulse">' + reviewCount + '</span>' 
                    : '';

                tabsHtml = [
                    '<button onclick="state.activeTab = \'gerente_monitoreo\'; state.gerenteViewingDept = null; render();" class="py-3 border-b-2 transition ' + (state.activeTab === 'gerente_monitoreo' ? 'border-blue-600 text-blue-600 dark:text-blue-400 font-bold' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900') + ' flex items-center gap-1.5">',
                    '  <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Monitoreo Global',
                    '</button>',
                    '<button onclick="state.activeTab = \'gerente_agenda\'; render();" class="py-3 border-b-2 transition ' + (state.activeTab === 'gerente_agenda' ? 'border-blue-600 text-blue-600 dark:text-blue-400 font-bold' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900') + ' flex items-center gap-1.5">',
                    '  <i data-lucide="calendar" class="w-4 h-4"></i> Calendario Consolidado',
                    '</button>',
                    '<button onclick="state.activeTab = \'tareas_flash\'; render();" class="py-3 border-b-2 transition ' + (state.activeTab === 'tareas_flash' ? 'border-blue-600 text-blue-600 dark:text-blue-400 font-bold' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900') + ' flex items-center gap-1.5">',
                    '  <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> Tareas Flash ' + gerenteBadgeHtml,
                    '</button>',
                    '<button onclick="state.activeTab = \'mi_perfil\'; render();" class="py-3 border-b-2 transition ' + (state.activeTab === 'mi_perfil' ? 'border-blue-600 text-blue-600 dark:text-blue-400 font-bold' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900') + ' flex items-center gap-1.5">',
                    '  <i data-lucide="user-check" class="w-4 h-4"></i> Mi Perfil',
                    '</button>'
                ].join('');
            } else {
                const pendingCount = getPendingFlashTaskCountForLeader(state.currentUser.department);
                const badgeHtml = pendingCount > 0 
                    ? '<span class="ml-1 px-1.5 py-0.5 text-[10px] font-extrabold bg-red-600 text-white rounded-full shadow-xs animate-pulse">' + pendingCount + '</span>' 
                    : '';

                tabsHtml = [
                    '<button onclick="state.activeTab = \'lider_agenda\'; render();" class="py-3 border-b-2 transition ' + (state.activeTab === 'lider_agenda' ? 'border-blue-600 text-blue-600 dark:text-blue-400 font-bold' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900') + ' flex items-center gap-1.5">',

        function renderActiveModule() {
            const isGerente = state.currentUser.role === 'Gerente';
            if (state.activeTab === 'mi_perfil') {
                return renderUserProfileView();
            }
            if (state.activeTab === 'tareas_flash') {
                return isGerente ? renderGerenteTareasFlashView() : renderLiderTareasFlashView();
            }
            if (isGerente) {
                if (state.activeTab === 'gerente_monitoreo') {
                    if (state.gerenteViewingDept) {
                        return renderGerenteDeptDetail(state.gerenteViewingDept);
                    }
                    return renderGerenteMonitoreo();
                }
                return renderGerenteAgendaOutlook();
            } else {
                if (state.activeTab === 'lider_agenda') return renderLiderAgendaOutlook();
                return renderLiderPlan();
            }
        }

        function saveLeaderFlashResponse(e, taskId) {
            if (e) e.preventDefault();
            const task = state.flashTasks.find(t => t.id === taskId);
            const statusEl = document.getElementById('resp-status');
            const noteEl = document.getElementById('resp-note');
            const fileEl = document.getElementById('resp-file');

            if (!task || !statusEl || !noteEl) return;

            const applySave = (fileData = null) => {
                task.status = statusEl.value;
                task.evidenceNote = noteEl.value.trim();
                if (fileData) {
                    task.evidenceFile = fileData;
                }
                saveState();
                closeModal();
                render();
                showToast('Respuesta enviada a Gerencia para ' + task.folio);
            };

            if (fileEl && fileEl.files && fileEl.files[0]) {
                const file = fileEl.files[0];
                const reader = new FileReader();
                reader.onload = function(evt) {
                    applySave({
                        name: file.name,
                        type: file.type,
                        url: evt.target.result
                    });
                };
                reader.readAsDataURL(file);
            } else {
                applySave();
            }
        }

        function saveLeaderFlashResponse(e, taskId) {
            if (e) e.preventDefault();
            const task = state.flashTasks.find(t => t.id === taskId);
            const statusEl = document.getElementById('resp-status');
            const noteEl = document.getElementById('resp-note');
            const fileEl = document.getElementById('resp-file');

            if (!task || !statusEl || !noteEl) return;

            const applySave = (fileData = null) => {
                task.status = statusEl.value;
                task.evidenceNote = noteEl.value.trim();
                if (fileData) {
                    task.evidenceFile = fileData;
                }
                saveState();
                closeModal();
                render();
                showToast('Respuesta enviada a Gerencia para ' + task.folio);
            };

            if (fileEl && fileEl.files && fileEl.files[0]) {
                const file = fileEl.files[0];
                const reader = new FileReader();
                reader.onload = function(evt) {
                    applySave({
                        name: file.name,
                        type: file.type,
                        url: evt.target.result
                    });
                };
                reader.readAsDataURL(file);
            } else {
                applySave();
            }
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast("Por favor selecciona un archivo de imagen válido.", "error");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                const hiddenInput = document.getElementById('profile-photo-base64');
                if (hiddenInput) hiddenInput.value = base64Url;

                // Live preview in DOM
                const formCircle = document.getElementById('form-avatar-circle');
                const avatarHeaderCircle = document.getElementById('avatar-container-preview');
                const imgHtml = '<img src="' + base64Url + '" class="w-full h-full object-cover" alt="Previsualización">';

                if (formCircle) formCircle.innerHTML = imgHtml;
                if (avatarHeaderCircle) avatarHeaderCircle.innerHTML = imgHtml;

                showToast("Vista previa de foto cargada.");
            };
            reader.readAsDataURL(file);
        }

        function removeProfilePhoto() {
            const hiddenInput = document.getElementById('profile-photo-base64');
            if (hiddenInput) hiddenInput.value = '';

        function saveUserProfile(e) {
            if (e) e.preventDefault();
            const nameEl = document.getElementById('profile-name');
            const emailEl = document.getElementById('profile-email');
            const phoneEl = document.getElementById('profile-phone');
            const photoEl = document.getElementById('profile-photo-base64');
            const currPassEl = document.getElementById('profile-curr-pass');
            const newPassEl = document.getElementById('profile-new-pass');

            if (!nameEl || !emailEl) return;

            const name = nameEl.value.trim();
            const email = emailEl.value.trim();
            const phone = phoneEl ? phoneEl.value.trim() : '';
            const photo = photoEl ? photoEl.value : null;

            if (currPassEl && currPassEl.value) {
                if (currPassEl.value !== state.currentUser.password) {
                    showToast("La contraseña actual es incorrecta.", "error");
                    return;
                }
                if (newPassEl && newPassEl.value.trim()) {
                    state.currentUser.password = newPassEl.value.trim();
                }
            }

            // Persist profile updates in state & localStorage
            state.currentUser.name = name;
            state.currentUser.email = email;
            state.currentUser.phone = phone;
            state.currentUser.photo = photo && photo.trim() !== '' ? photo : null;

            // Also update user record inside INITIAL_USERS array if present
            const foundUserIndex = INITIAL_USERS.findIndex(u => u.id === state.currentUser.id);
            if (foundUserIndex >= 0) {
                INITIAL_USERS[foundUserIndex] = { ...state.currentUser };
            }

            saveState();
            render();
            showToast("Perfil y foto de usuario actualizados correctamente.");
        }

            const dayOfWeek = baseDate.getDay();
            const diffToMonday = (dayOfWeek === 0 ? -6 : 1) - dayOfWeek;
            const monday = new Date(baseDate);
            monday.setDate(baseDate.getDate() + diffToMonday);

            const weekDays = [];
            const dayNamesMap = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const shortNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const activeWeekFullDates = [];

            for (let i = 0; i < 5; i++) { // Monday (0) to Friday (4)
                const tempDate = new Date(monday);
                tempDate.setDate(monday.getDate() + i);
                const dateNum = tempDate.getDate();
                const year = tempDate.getFullYear();
                const month = String(tempDate.getMonth() + 1).padStart(2, '0');
                const dayStr = String(dateNum).padStart(2, '0');
                const fullDateStr = `${year}-${month}-${dayStr}`;

        function renderLiderAgendaOutlook() {
            const miniYear = state.miniCalendarDate.getFullYear();
            const miniMonth = state.miniCalendarDate.getMonth();
            const monthNames = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            const miniMonthTitle = `${monthNames[miniMonth]} de ${miniYear}`;

            const firstDayOfMonth = new Date(miniYear, miniMonth, 1).getDay();
            const daysInMonth = new Date(miniYear, miniMonth + 1, 0).getDate();
            const prevMonthDays = new Date(miniYear, miniMonth, 0).getDate();

            let miniDaysHtml = '';
            for (let i = firstDayOfMonth - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                miniDaysHtml += `<div class="py-1 rounded-full text-slate-300 dark:text-slate-600">${dayNum}</div>`;
            }
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${miniYear}-${String(miniMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const isSelected = dateStr === state.currentDate.toISOString().split('T')[0];
                miniDaysHtml += `<div onclick="selectMiniCalendarDate('${dateStr}')" class="py-1 rounded-full ${isSelected ? 'bg-[#0078d4] text-white font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer'}">${i}</div>`;
            }
            const totalCellsSoFar = firstDayOfMonth + daysInMonth;
            const remainingCells = totalCellsSoFar <= 35 ? 35 - totalCellsSoFar : 42 - totalCellsSoFar;
            for (let i = 1; i <= remainingCells; i++) {
                miniDaysHtml += `<div class="py-1 rounded-full text-slate-300 dark:text-slate-600">${i}</div>`;
            }

            const currentFormattedRange = getMainCalendarDateRangeLabel();
            const displayedMeetings = state.meetings.filter(m => m.department === state.currentUser.department);

            // Compute summary of meetings by day for Monday-Friday (current week)
            const curr = new Date(state.currentDate);
            const dayOfWeek = curr.getDay();
            const sunday = new Date(curr);
            sunday.setDate(curr.getDate() - dayOfWeek);

            const weekDaysSummary = [];
            const dayNamesMap = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            for (let i = 1; i <= 5; i++) { // Monday to Friday
                const tempDate = new Date(sunday);
                tempDate.setDate(sunday.getDate() + i);
                const fullDateStr = tempDate.toISOString().split('T')[0];
                const count = displayedMeetings.filter(m => m.date === fullDateStr).length;
                weekDaysSummary.push({ name: dayNamesMap[i], dateStr: fullDateStr, count });
            }

            // Identify busiest day
            let busiestDayName = 'Ninguno';
            let maxMeetingCount = 0;
            weekDaysSummary.forEach(d => {
                if (d.count > maxMeetingCount) {
                    maxMeetingCount = d.count;
                    busiestDayName = d.name;

                        </div>

                        </div>

                        </div>

                            ${weekDaysSummary.map(d => `

                    </div>
                </aside>

                <div class="flex-1 flex flex-col bg-white dark:bg-slate-900 overflow-hidden">
                    <div class="px-6 py-3 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-white dark:bg-slate-900">
                        <div class="flex items-center gap-3">
                            <button onclick="goToToday()" class="px-3 py-1.5 border border-slate-300 dark:border-slate-600 rounded text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 transition">Hoy</button>
                            <div class="flex items-center">
                                <button onclick="navigateCalendar(-1)" class="p-1.5 border border-slate-300 dark:border-slate-600 rounded-l hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                                <button onclick="navigateCalendar(1)" class="p-1.5 border-t border-b border-slate-300 dark:border-slate-600 rounded-r hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                            </div>
                            <h2 class="text-sm font-bold text-slate-900 dark:text-white ml-2">${currentFormattedRange}</h2>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded border border-slate-200 dark:border-slate-700">
                                <button onclick="setCalendarViewMode('week')" class="px-3 py-1 rounded text-xs font-bold transition ${state.calendarViewMode === 'week' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-xs' : 'text-slate-600 dark:text-slate-400'}">Semanal</button>
                                <button onclick="setCalendarViewMode('day')" class="px-3 py-1 rounded text-xs font-bold transition ${state.calendarViewMode === 'day' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-xs' : 'text-slate-600 dark:text-slate-400'}">Día</button>
                                <button onclick="setCalendarViewMode('month')" class="px-3 py-1 rounded text-xs font-bold transition ${state.calendarViewMode === 'month' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-xs' : 'text-slate-600 dark:text-slate-400'}">Mes</button>
                            </div>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto relative">
                        ${state.calendarViewMode === 'month' ? renderMonthGridView(displayedMeetings) : renderWeekOrDayView(displayedMeetings)}
                    </div>
                </div>
            `;
        }

        function getMainCalendarDateRangeLabel() {
            const curr = new Date(state.currentDate);
            const monthNames = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            if (state.calendarViewMode === 'day') {
                return `${curr.getDate()} de ${monthNames[curr.getMonth()]} de ${curr.getFullYear()}`;
            }
            if (state.calendarViewMode === 'month') {
                return `${monthNames[curr.getMonth()]} de ${curr.getFullYear()}`;
            }
            // Week range
            const dayOfWeek = curr.getDay();
            const sunday = new Date(curr);
            sunday.setDate(curr.getDate() - dayOfWeek);
            const saturday = new Date(sunday);
            saturday.setDate(sunday.getDate() + 6);
            return `${sunday.getDate()} de ${monthNames[sunday.getMonth()]} - ${saturday.getDate()} de ${monthNames[saturday.getMonth()]} ${saturday.getFullYear()}`;
        }

        function navigateCalendar(direction) {
            if (state.calendarViewMode === 'day') {
                state.currentDate.setDate(state.currentDate.getDate() + direction);
            } else if (state.calendarViewMode === 'month') {
                state.currentDate.setMonth(state.currentDate.getMonth() + direction);
            } else {
                state.currentDate.setDate(state.currentDate.getDate() + (direction * 7));
            }
            render();
        }

        function goToToday() {
            state.currentDate = new Date(2026, 10, 2);
            render();
        }

        function setCalendarViewMode(mode) {
            state.calendarViewMode = mode;
            render();
        }

        function selectMiniCalendarDate(dateStr) {
            state.currentDate = new Date(dateStr + 'T00:00:00');
            render();
        }

        function changeMiniCalendarMonth(direction) {
            state.miniCalendarDate.setMonth(state.miniCalendarDate.getMonth() + direction);
            render();
        }

        function renderWeekOrDayView(meetings) {
            const hours = ['09:00 hrs', '10:00 hrs', '11:00 hrs', '12:00 hrs', '13:00 hrs', '14:00 hrs', '15:00 hrs', '16:00 hrs', '17:00 hrs', '18:00 hrs', '19:00 hrs'];
            
            const curr = new Date(state.currentDate);
            const dayOfWeek = curr.getDay();
            const sunday = new Date(curr);
            sunday.setDate(curr.getDate() - dayOfWeek);

            const days = [];
            const dayNames = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
            for (let i = 0; i < 7; i++) {
                const tempDate = new Date(sunday);
                tempDate.setDate(sunday.getDate() + i);
                const dateNumStr = String(tempDate.getDate()).padStart(2, '0');
                const fullDateStr = tempDate.toISOString().split('T')[0];
                const isToday = fullDateStr === new Date().toISOString().split('T')[0];
                days.push({ name: dayNames[i], date: dateNumStr, fullDate: fullDateStr, active: isToday });
            }

            const activeDays = state.calendarViewMode === 'day' ? [days[curr.getDay()]] : days;
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const currentHourNum = now.getHours();
            const currentMinNum = now.getMinutes();

            return `
                <div class="min-w-[800px] flex flex-col h-full">
                    <div class="grid grid-cols-8 border-b border-slate-200 dark:border-slate-800 bg-[#fbfbfb] dark:bg-slate-900 sticky top-0 z-10 text-xs">
                        <div class="py-2.5 px-3 text-slate-400 font-bold text-center border-r border-slate-200 dark:border-slate-800">Hora</div>
                        ${activeDays.map(d => `
                            <div class="py-2.5 px-2 text-center border-r border-slate-200 dark:border-slate-800 ${d.active ? 'bg-blue-50/50 dark:bg-blue-950/20' : ''}">
                                <div class="text-[10px] font-bold text-slate-400">${d.name}</div>
                                <div class="text-sm font-bold ${d.active ? 'text-blue-600 dark:text-blue-400' : 'text-slate-800 dark:text-slate-200'}">${d.date}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex-1 relative">
                        ${hours.map((hourLabel, hIndex) => {
                            const slotHour = 9 + hIndex;
                            const hourTimeStr = slotHour.toString().padStart(2, '0') + ':00';
                            const isCurrentHourSlot = todayStr === state.currentDate.toISOString().split('T')[0] && currentHourNum === slotHour;

                            return `
                                <div class="grid grid-cols-8 border-b border-slate-100 dark:border-slate-800/60 min-h-[75px] relative">
                                    <div class="py-2 px-3 text-[11px] font-medium text-slate-400 border-r border-slate-200 dark:border-slate-800 text-center">${hourLabel}</div>
                                    ${activeDays.map((d, dIndex) => {
                                        const cellMeetings = meetings.filter(m => {
                                            if (m.date !== d.fullDate) return false;
                                            const mHour = m.startTime.split(':')[0];
                                            return m.startTime.startsWith(hourTimeStr.substring(0,2)) || mHour === slotHour.toString();
                                        });

                                        const isTodayCol = d.fullDate === todayStr;

                                        return `
                                            <div ondragover="event.preventDefault()" ondrop="dropMeeting(event, '${d.fullDate}', '${hourTimeStr}')" onclick="openMeetingModal(null, '${d.fullDate}', '${hourTimeStr}')" class="border-r border-slate-100 dark:border-slate-800/60 p-1 relative hover:bg-blue-50/30 dark:hover:bg-blue-950/10 cursor-pointer transition">
                                                ${isTodayCol && isCurrentHourSlot ? `
                                                    <div class="absolute left-0 right-0 z-20 flex items-center pointer-events-none" style="top: ${(currentMinNum / 60) * 100}%">
                                                        <div class="w-2.5 h-2.5 bg-blue-500 rounded-full shadow-md -ml-1 shrink-0"></div>
                                                        <div class="h-[2px] bg-blue-500 flex-1"></div>
                                                    </div>
                                                ` : ''}
                                                ${cellMeetings.map(m => `
                                                    <div draggable="true" ondragstart="state.draggingMeetingId = '${m.id}'" onclick="event.stopPropagation(); openMeetingModal('${m.id}')" class="p-2 rounded ${getDeptMeetingCardStyle(m.department, m.color)} text-xs shadow-xs space-y-1 mb-1 group">
                                                        <div class="flex justify-between items-start gap-1">
                                                            <span class="font-bold truncate flex items-center gap-1.5">
                                                                ${getPriorityDotClass(m.color)}
                                                                ${m.title}
                                                            </span>
                                                            <button onclick="event.stopPropagation(); deleteMeeting('${m.id}')" class="text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition shrink-0"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                                                        </div>
                                                        <div class="text-[10px] opacity-75 flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> ${m.location}</div>
                                                        <div class="text-[10px] font-semibold">${m.startTime} - ${m.endTime}</div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderMonthGridView(meetings) {
            const year = state.currentDate.getFullYear();
            const month = state.currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            return `
                <div class="p-6 grid grid-cols-7 gap-3 h-full overflow-y-auto">
                    ${Array.from({length: daysInMonth}, (_, i) => {
                        const dayNum = i + 1;
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                        const dayMeetings = meetings.filter(m => m.date === dateStr);
                        const isToday = dateStr === new Date().toISOString().split('T')[0];

                        return `
                            <div onclick="openMeetingModal(null, '${dateStr}', '09:00')" class="bg-white dark:bg-slate-800 rounded-lg p-3 border border-slate-200 dark:border-slate-700 shadow-xs flex flex-col min-h-[120px] cursor-pointer hover:border-blue-500 transition">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold ${isToday ? 'bg-blue-600 text-white px-2 py-0.5 rounded-full' : 'text-slate-800 dark:text-slate-200'}">${dayNum}</span>
                                    <span class="text-[10px] text-slate-400">${dayMeetings.length} eventos</span>
                                </div>
                                <div class="space-y-1 overflow-y-auto flex-1">
                                    ${dayMeetings.map(m => `
                                        <div class="text-[10px] ${getDeptMeetingCardStyle(m.department, m.color)} p-1 rounded truncate font-medium flex items-center gap-1">
                                            ${getPriorityDotClass(m.color)}
                                            <span>${m.startTime} • ${m.title}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function dropMeeting(event, targetDate, targetHour) {
            event.preventDefault();
            if (!state.draggingMeetingId) return;
            const m = state.meetings.find(x => x.id === state.draggingMeetingId);
            if (m) {
                m.date = targetDate;
                m.startTime = targetHour;
                saveState();
                render();
                showToast("Reunión reprogramada exitosamente.");
            }
            state.draggingMeetingId = null;
        }

        function navigateWeekPlan(direction) {
            state.weekPlanDate.setDate(state.weekPlanDate.getDate() + (direction * 7));
            render();
        }

        function resetWeekPlanToCurrent() {
            state.weekPlanDate = new Date(2026, 10, 2);
            render();
        }

        // --- MONTHLY ANALYTICS DASHBOARD MODAL ---
        function openMonthlyAnalyticsModal(selectedYearMonth = null) {
            const deptId = state.currentUser.department;
            const deptActs = state.activities.filter(a => a.department === deptId);

            // Determine target year and month based on selection or fallback to current state.weekPlanDate
            let targetYear, targetMonth;
            if (selectedYearMonth) {
                const parts = selectedYearMonth.split('-');
                if (parts.length === 2) {
                    targetYear = parseInt(parts[0]);
                    targetMonth = parseInt(parts[1]) - 1;
                }
            }
            if (targetYear === undefined || isNaN(targetYear)) {
                targetYear = state.weekPlanDate.getFullYear();
                targetMonth = state.weekPlanDate.getMonth();
            }

            const currentYearMonthVal = `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}`;

            // Filter activities belonging to the selected month and year
            const monthActs = deptActs.filter(a => {
                if (!a.date) return false;
                const parts = a.date.split('-');
                if (parts.length !== 3) return false;
                const aYear = parseInt(parts[0]);
                const aMonth = parseInt(parts[1]) - 1;
                return aYear === targetYear && aMonth === targetMonth;
            });

            const totalMonthActs = monthActs.length;
            const pendingMonth = monthActs.filter(a => a.status === 'PENDIENTE').length;
            const inProcessMonth = monthActs.filter(a => a.status === 'EN PROCESO').length;
            const completedMonth = monthActs.filter(a => a.status === 'COMPLETADA').length;

            const monthlyProg = totalMonthActs === 0 ? 0 : Math.round(
                ((completedMonth * 100) + (inProcessMonth * 50)) / totalMonthActs
            );

            // Workload concentration analysis by weekday name
            const weekdayCounts = { 'Lunes': 0, 'Martes': 0, 'Miércoles': 0, 'Jueves': 0, 'Viernes': 0 };
            monthActs.forEach(a => {
                if (weekdayCounts[a.day] !== undefined) {
                    weekdayCounts[a.day]++;
                } else {
                    if (a.date) {
                        const parts = a.date.split('-');
                        if (parts.length === 3) {
                            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                            const map = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                            const dayName = map[d.getDay()];
                            if (weekdayCounts[dayName] !== undefined) {
                                weekdayCounts[dayName]++;
                            }
                        }
                    }
                }
            });

            const maxDayCount = Math.max(...Object.values(weekdayCounts), 1);

            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            const monthLabel = `${monthNames[targetMonth]} ${targetYear}`;

            const contentEl = document.getElementById('modal-content');
            if (contentEl) {
                contentEl.innerHTML = `
                    <div class="p-6 space-y-6 text-xs max-h-[85vh] overflow-y-auto">
                        <!-- Clean Header with No Overlap -->
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-200 dark:border-slate-700 pb-4 gap-4">
                            <div>
                                <h3 class="text-base font-bold text-slate-900 dark:text-white leading-tight">Rendimiento Consolidado Mensual</h3>
                                <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400 mt-0.5 block">Período: ${monthLabel}</span>
                            </div>
                            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                                <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 shadow-2xs">
                                    <label class="font-bold text-slate-500 dark:text-slate-400 uppercase text-[10px] shrink-0">MES/AÑO:</label>
                                    <input type="month" id="dashboard-month-selector" value="${currentYearMonthVal}" onchange="openMonthlyAnalyticsModal(this.value)" class="bg-transparent font-bold text-slate-900 dark:text-white text-xs focus:outline-hidden cursor-pointer">
                                </div>
                                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition shrink-0"><i data-lucide="x" class="w-5 h-5"></i></button>
                            </div>
                        </div>

                        <!-- KPI Summary Cards (Clean Layout without Criticality Badges) -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-blue-50 dark:bg-blue-950/40 p-4 rounded-xl border border-blue-200 dark:border-blue-900 flex flex-col justify-between shadow-2xs">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] font-bold text-blue-700 dark:text-blue-300 uppercase tracking-wide">Actividades Mes</span>
                                    <div class="p-1.5 bg-blue-100 dark:bg-blue-900/60 rounded-lg text-blue-600 dark:text-blue-300"><i data-lucide="layout-grid" class="w-4 h-4"></i></div>
                                </div>
                                <div class="text-3xl font-extrabold text-blue-900 dark:text-blue-100">${totalMonthActs}</div>
                            </div>
                            <div class="bg-red-50 dark:bg-red-950/40 p-4 rounded-xl border border-red-200 dark:border-red-900 flex flex-col justify-between shadow-2xs">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] font-bold text-red-700 dark:text-red-300 uppercase tracking-wide">Pendientes</span>
                                    <div class="p-1.5 bg-red-100 dark:bg-red-900/60 rounded-lg text-red-600 dark:text-red-300"><i data-lucide="clock" class="w-4 h-4"></i></div>
                                </div>
                                <div class="text-3xl font-extrabold text-red-900 dark:text-red-100">${pendingMonth}</div>
                            </div>
                            <div class="bg-amber-50 dark:bg-amber-950/40 p-4 rounded-xl border border-amber-200 dark:border-amber-900 flex flex-col justify-between shadow-2xs">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] font-bold text-amber-700 dark:text-amber-300 uppercase tracking-wide">En Proceso</span>
                                    <div class="p-1.5 bg-amber-100 dark:bg-amber-900/60 rounded-lg text-amber-600 dark:text-amber-300"><i data-lucide="loader" class="w-4 h-4"></i></div>
                                </div>
                                <div class="text-3xl font-extrabold text-amber-900 dark:text-amber-100">${inProcessMonth}</div>
                            </div>
                            <div class="bg-emerald-50 dark:bg-emerald-950/40 p-4 rounded-xl border border-emerald-200 dark:border-emerald-900 flex flex-col justify-between shadow-2xs">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] font-bold text-emerald-700 dark:text-emerald-300 uppercase tracking-wide">Completadas</span>
                                    <div class="p-1.5 bg-emerald-100 dark:bg-emerald-900/60 rounded-lg text-emerald-600 dark:text-emerald-300"><i data-lucide="check-circle-2" class="w-4 h-4"></i></div>
                                </div>
                                <div class="text-3xl font-extrabold text-emerald-900 dark:text-emerald-100">${completedMonth}</div>
                            </div>
                        </div>

                        <!-- Global Compliance Progress -->
                        <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-slate-700 dark:text-slate-300 uppercase">Avance Global del Mes</span>
                                <span class="font-extrabold text-sm text-indigo-600 dark:text-indigo-400">${monthlyProg}%</span>
                            </div>
                            <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-3 overflow-hidden">
                                <div class="bg-indigo-600 h-3 rounded-full transition-all duration-500" style="width: ${monthlyProg}%"></div>
                            </div>
                        </div>

                        <!-- Workload Distribution Analysis Cards (Original Clean Format) -->
                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 dark:text-slate-200 uppercase flex items-center gap-1.5">
                                <i data-lucide="trending-up" class="w-4 h-4 text-blue-600"></i> Análisis de Concentración de Carga (Por Día de la Semana)
                            </h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                                ${Object.entries(weekdayCounts).map(([dayName, count]) => {
                                    const percentage = Math.round((count / maxDayCount) * 100);
                                    return `
                                        <div class="p-3.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-3 shadow-2xs flex flex-col justify-between">
                                            <div class="flex justify-between items-center">
                                                <span class="text-xs font-bold text-slate-700 dark:text-slate-300">${dayName}</span>

                                            <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2 overflow-hidden">
                                                <div class="bg-blue-600 h-2 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>

                        <div class="flex justify-end pt-3 border-t border-slate-200 dark:border-slate-700">

            const backdrop = document.getElementById('modal-backdrop');
            if (backdrop) backdrop.className = 'flex fixed inset-0 bg-black/40 backdrop-blur-xs z-50 items-center justify-center p-4';
            safeCreateIcons();
        }

        // --- GERENTE MODULES ---
        function renderGerenteAgendaOutlook() {
            const miniYear = state.miniCalendarDate.getFullYear();
            const miniMonth = state.miniCalendarDate.getMonth();
            const monthNames = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            const miniMonthTitle = `${monthNames[miniMonth]} de ${miniYear}`;

            const firstDayOfMonth = new Date(miniYear, miniMonth, 1).getDay();
            const daysInMonth = new Date(miniYear, miniMonth + 1, 0).getDate();
            const prevMonthDays = new Date(miniYear, miniMonth, 0).getDate();

            let miniDaysHtml = '';
            for (let i = firstDayOfMonth - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                miniDaysHtml += `<div class="py-1 rounded-full text-slate-300 dark:text-slate-600">${dayNum}</div>`;
            }
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${miniYear}-${String(miniMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const isSelected = dateStr === state.currentDate.toISOString().split('T')[0];
                miniDaysHtml += `<div onclick="selectMiniCalendarDate('${dateStr}')" class="py-1 rounded-full ${isSelected ? 'bg-[#0078d4] text-white font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer'}">${i}</div>`;
            }
            const totalCellsSoFar = firstDayOfMonth + daysInMonth;
            const remainingCells = totalCellsSoFar <= 35 ? 35 - totalCellsSoFar : 42 - totalCellsSoFar;
            for (let i = 1; i <= remainingCells; i++) {
                miniDaysHtml += `<div class="py-1 rounded-full text-slate-300 dark:text-slate-600">${i}</div>`;
            }

            const currentFormattedRange = getMainCalendarDateRangeLabel();

        function renderGerenteWeekOrDayView(meetings) {
            const hours = ['09:00 hrs', '10:00 hrs', '11:00 hrs', '12:00 hrs', '13:00 hrs', '14:00 hrs', '15:00 hrs', '16:00 hrs', '17:00 hrs', '18:00 hrs', '19:00 hrs'];
            
            const curr = new Date(state.currentDate);
            const dayOfWeek = curr.getDay();
            const sunday = new Date(curr);
            sunday.setDate(curr.getDate() - dayOfWeek);

            const days = [];
            const dayNames = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
            for (let i = 0; i < 7; i++) {
                const tempDate = new Date(sunday);
                tempDate.setDate(sunday.getDate() + i);
                const dateNumStr = String(tempDate.getDate()).padStart(2, '0');
                const fullDateStr = tempDate.toISOString().split('T')[0];
                const isToday = fullDateStr === new Date().toISOString().split('T')[0];
                days.push({ name: dayNames[i], date: dateNumStr, fullDate: fullDateStr, active: isToday });
            }

            const activeDays = state.calendarViewMode === 'day' ? [days[curr.getDay()]] : days;
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const currentHourNum = now.getHours();
            const currentMinNum = now.getMinutes();

            return `
                <div class="min-w-[800px] flex flex-col h-full relative">
                    <div class="grid grid-cols-8 border-b border-slate-200 dark:border-slate-800 bg-[#fbfbfb] dark:bg-slate-900 sticky top-0 z-10 text-xs">
                        <div class="py-2.5 px-3 text-slate-400 font-bold text-center border-r border-slate-200 dark:border-slate-800">Hora</div>
                        ${activeDays.map(d => `
                            <div class="py-2.5 px-2 text-center border-r border-slate-200 dark:border-slate-800 ${d.active ? 'bg-blue-50/50 dark:bg-blue-950/20' : ''}">
                                <div class="text-[10px] font-bold text-slate-400">${d.name}</div>
                                <div class="text-sm font-bold ${d.active ? 'text-blue-600 dark:text-blue-400' : 'text-slate-800 dark:text-slate-200'}">${d.date}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex-1 relative">
                        ${hours.map((hourLabel, hIndex) => {
                            const slotHour = 9 + hIndex;
                            const hourTimeStr = slotHour.toString().padStart(2, '0') + ':00';
                            const isCurrentHourSlot = todayStr === state.currentDate.toISOString().split('T')[0] && currentHourNum === slotHour;

                            return `
                                <div class="grid grid-cols-8 border-b border-slate-100 dark:border-slate-800/60 min-h-[75px] relative">
                                    <div class="py-2 px-3 text-[11px] font-medium text-slate-400 border-r border-slate-200 dark:border-slate-800 text-center">${hourLabel}</div>
                                    ${activeDays.map((d, dIndex) => {
                                        const cellMeetings = meetings.filter(m => {
                                            if (m.date !== d.fullDate) return false;
                                            const mHour = m.startTime.split(':')[0];
                                            return m.startTime.startsWith(hourTimeStr.substring(0,2)) || mHour === slotHour.toString();
                                        });

                                        const isTodayCol = d.fullDate === todayStr;

                                        return `
                                            <div ondragover="event.preventDefault()" ondrop="dropMeeting(event, '${d.fullDate}', '${hourTimeStr}')" onclick="${state.activeGerenteCal === 'cal_go' ? `openMeetingModal(null, '${d.fullDate}', '${hourTimeStr}', 'cal_go')` : ''}" class="border-r border-slate-100 dark:border-slate-800/60 p-1 relative hover:bg-blue-50/30 dark:hover:bg-blue-950/10 cursor-pointer transition">
                                                ${isTodayCol && isCurrentHourSlot ? `
                                                    <div class="absolute left-0 right-0 z-20 flex items-center pointer-events-none" style="top: ${(currentMinNum / 60) * 100}%">
                                                        <div class="w-2.5 h-2.5 bg-blue-500 rounded-full shadow-md -ml-1 shrink-0"></div>
                                                        <div class="h-[2px] bg-blue-500 flex-1"></div>
                                                    </div>
                                                ` : ''}
                                                ${cellMeetings.map(m => {
                                                    const deptIcon = getDepartmentIcon(m.department);
                                                    return `
                                                        <div draggable="true" ondragstart="state.draggingMeetingId = '${m.id}'" onclick="event.stopPropagation(); openMeetingModal('${m.id}')" class="p-2 rounded ${getDeptMeetingCardStyle(m.department, m.color)} text-xs shadow-xs space-y-1 mb-1 group">
                                                            <div class="flex justify-between items-start">
                                                                <span class="font-bold truncate flex items-center gap-1">
                                                                    <i data-lucide="${deptIcon}" class="w-3 h-3 shrink-0"></i> ${m.title}
                                                                </span>
                                                                ${state.activeGerenteCal === 'cal_go' ? `<button onclick="event.stopPropagation(); deleteMeeting('${m.id}')" class="text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : ''}
                                                            </div>
                                                            <div class="text-[9px] font-bold opacity-80">${getDepartmentName(m.department)}</div>
                                                            <div class="text-[10px] opacity-75 flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> ${m.location}</div>
                                                            <div class="text-[10px] font-semibold">${m.startTime} - ${m.endTime}</div>
                                                        </div>
                                                    `;
                                                }).join('')}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderGerenteMonthGridView(meetings) {

                                <div class="space-y-1 overflow-y-auto flex-1">

                                            <i data-lucide="${getDepartmentIcon(m.department)}" class="w-2.5 h-2.5 shrink-0"></i> ${m.startTime} • ${m.title}

                            </div>
                        `;

            const globalPendingCount = state.activities.filter(a => a.status === 'PENDIENTE').length;

            const globalCompletedCount = state.activities.filter(a => a.status === 'COMPLETADA').length;

            const meetingsByDept = INITIAL_DEPARTMENTS.map(d => ({
                ...d,
                count: state.meetings.filter(m => m.department === d.id).length
            }));

            // Calculate department rankings based on compliance progress
            const deptRankings = INITIAL_DEPARTMENTS.map(d => {
                const prog = calculateProgress(d.id);
                const deptActs = state.activities.filter(a => a.department === d.id);
                const completed = deptActs.filter(a => a.status === 'COMPLETADA').length;

                <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-[#f3f2f1] dark:bg-slate-900 transition-colors">

                                <i data-lucide="building-2" class="w-6 h-6 text-blue-500"></i> Monitoreo de Avance Semanal y Dashboard Ejecutivo
                            </h2>
                        </div>
                    </div>

                    <!-- Executive Dashboard Summary Cards -->

                            <div class="p-2.5 bg-blue-100 dark:bg-blue-900/50 rounded-lg text-blue-700 dark:text-blue-300">
                                <i data-lucide="layout-list" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <div class="text-xs text-blue-700 dark:text-blue-300 font-bold uppercase">Actividades Totales</div>

                            <div class="p-2.5 bg-red-100 dark:bg-red-900/50 rounded-lg text-red-700 dark:text-red-300">
                                <i data-lucide="clock" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <div class="text-xs text-red-700 dark:text-red-300 font-bold uppercase">Pendientes</div>

                            </div>
                        </div>
                        <div class="bg-amber-50 dark:bg-amber-950/40 p-4 rounded-lg border border-amber-200 dark:border-amber-900 flex items-center gap-3">
                            <div class="p-2.5 bg-amber-100 dark:bg-amber-900/50 rounded-lg text-amber-700 dark:text-amber-300">

                            </div>
                        </div>
                        <div class="bg-emerald-50 dark:bg-emerald-950/40 p-4 rounded-lg border border-emerald-200 dark:border-emerald-900 flex items-center gap-3">
                            <div class="p-2.5 bg-emerald-100 dark:bg-emerald-900/50 rounded-lg text-emerald-700 dark:text-emerald-300">

                        <div class="bg-indigo-50 dark:bg-indigo-950/40 p-4 rounded-lg border border-indigo-200 dark:border-indigo-900 col-span-2 md:col-span-1 flex flex-col justify-between">

        function saveCalendarEdit(calId) {
            const nameInput = document.getElementById(`cal-name-${calId}`);
            const colorInput = document.getElementById(`cal-color-${calId}`);
            if (!nameInput || !colorInput) return;
            const cal = state.calendars.find(c => c.id === calId);
            if (cal) {
                cal.name = nameInput.value;
                cal.color = colorInput.value;
                saveState();
                render();
                showToast("Calendario actualizado.");
                openCalendarManagerModal();
            }
        }

        function addNewCalendar() {
            const nameInput = document.getElementById('new-cal-name');
            const colorInput = document.getElementById('new-cal-color');
            if (!nameInput || !nameInput.value.trim()) return;
            state.calendars.push({
                id: 'cal_' + Date.now(),
                name: nameInput.value.trim(),
                color: colorInput ? colorInput.value : 'blue'
            });
            saveState();
            render();
            showToast("Nuevo calendario creado.");
            openCalendarManagerModal();
        }
